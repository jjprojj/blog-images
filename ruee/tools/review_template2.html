<title>RUÉE 게시 검수</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Song+Myung&display=swap">
<style>
/* layout: 위에 이번 주 인스타 피드 미리보기(표지 4장), 아래에 시리즈별 카드. 카드는 컨셉마다 색·글꼴이 달라 한눈에 구분된다. 폰 먼저 설계 */
:root{
  --bg:#ece9e3; --surface:#fbfaf7; --ink:#1c1a17; --muted:#6d675f; --line:#d9d4cb; --brand:#1c1a17;
  --ok:#2c6a43; --ok-bg:#dcecdf; --warn:#855710; --warn-bg:#f5e8cf; --no:#8c2e2e; --no-bg:#f4dedc;
  --display:"Gowun Batang",serif; --body:"Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121212; --surface:#1c1b1a; --ink:#efebe5; --muted:#a09a91; --line:#33302c; --brand:#efebe5;
  --ok:#8fcfa3; --ok-bg:#1f3427; --warn:#e3bd78; --warn-bg:#3a2e17; --no:#eda3a0; --no-bg:#3d2221;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1c1b1a; --ink:#efebe5; --muted:#a09a91; --line:#33302c; --brand:#efebe5;
  --ok:#8fcfa3; --ok-bg:#1f3427; --warn:#e3bd78; --warn-bg:#3a2e17; --no:#eda3a0; --no-bg:#3d2221;
  color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:16px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.3em;color:var(--brand)}
.sub{font-size:13px;color:var(--muted)}
#banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:11px 14px;font-size:14px;margin-bottom:14px}
h2.sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 10px}
/* 피드 미리보기: 인스타 프로필 3열 그리드 */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;border-radius:10px;overflow:hidden}
.grid .g{position:relative;aspect-ratio:4/5;background:var(--line);display:block;border:0;padding:0;cursor:pointer}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .tag{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
.grid .ph{display:grid;place-items:center;height:100%;font-size:12px;color:var(--muted);text-align:center;padding:6px}
.list{display:grid;gap:26px}
/* 컨셉별 세계관 */
.card{--c-bg:#f3eee4;--c-ink:#1f1b17;--c-acc:#b5573a;--c-on:#fff;--c-sub:#7a6f63;--c-line:#d6ccbb;--c-font:"Gowun Batang",serif;--c-w:700;
  background:var(--c-bg);color:var(--c-ink);border-radius:16px;overflow:hidden;border:1px solid var(--c-line)}
.card[data-c="street"]{--c-bg:#0e0e0e;--c-ink:#f5f5f0;--c-acc:#c6f432;--c-on:#0e0e0e;--c-sub:#9a9a94;--c-line:#2f2f2f;--c-font:"Black Han Sans",sans-serif;--c-w:400}
.card[data-c="heritage"]{--c-bg:#14161f;--c-ink:#f1ebdd;--c-acc:#b89b5e;--c-on:#14161f;--c-sub:#a89f8a;--c-line:#4a4535;--c-font:"Song Myung",serif;--c-w:400}
.card[data-c="active"]{--c-bg:#f4f4ef;--c-ink:#101114;--c-acc:#1f4fff;--c-on:#fff;--c-sub:#6b6e75;--c-line:#d0d2d6;--c-font:"Noto Sans KR",sans-serif;--c-w:900}
.chead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:12px 14px}
.cname{background:var(--c-acc);color:var(--c-on);font-size:12px;font-weight:900;letter-spacing:.06em;padding:3px 10px;border-radius:999px}
.code{font-size:12px;color:var(--c-sub);letter-spacing:.06em}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn);margin-left:auto}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.no{background:var(--no-bg);color:var(--no)}
.car{position:relative;background:#000;aspect-ratio:4/5}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;display:block}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#111;font-size:19px;cursor:pointer}
.prev{left:8px}.next{right:8px}
.count{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 2px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs button{flex:0 0 46px;aspect-ratio:4/5;border:2px solid transparent;border-radius:5px;padding:0;overflow:hidden;background:none;cursor:pointer;opacity:.65}
.thumbs button.on{border-color:var(--c-acc);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.cbody{padding:14px;display:flex;flex-direction:column;gap:12px}
.title{font-family:var(--c-font);font-weight:var(--c-w);font-size:24px;line-height:1.3;margin:0;text-wrap:balance}
.when{font-size:14px;color:var(--c-sub)}.when b{color:var(--c-ink);font-variant-numeric:tabular-nums}
.cap{white-space:pre-wrap;font-size:14px;line-height:1.7;border:1px solid var(--c-line);border-radius:10px;padding:12px 14px;max-height:200px;overflow:auto}
.tags{font-size:13px;color:var(--c-acc)}
.card[data-c="daily"] .tags,.card[data-c="active"] .tags{color:var(--c-acc)}
.note{font-size:13px;color:var(--no)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
button.act{font:inherit;font-size:15px;font-weight:700;border-radius:12px;padding:12px 18px;cursor:pointer;border:1px solid var(--c-line);background:transparent;color:var(--c-ink);min-height:46px}
button.act.primary{background:var(--c-acc);color:var(--c-on);border-color:var(--c-acc);flex:1 1 140px}
button.act.danger{color:var(--no);border-color:var(--no)}
.card[data-c="street"] button.act.danger,.card[data-c="heritage"] button.act.danger{color:#f0a6a3;border-color:#f0a6a3}
button.act:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:2px solid var(--c-acc);outline-offset:2px}
.panel{border:1px solid var(--c-line);border-radius:12px;padding:12px;display:grid;gap:10px}
.panel p{margin:0;font-size:13px;color:var(--c-sub)}
.reasons{display:flex;flex-wrap:wrap;gap:8px}
.reasons button{font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid var(--c-line);background:transparent;color:var(--c-ink);cursor:pointer}
.reasons button.on{background:var(--c-acc);color:var(--c-on);border-color:var(--c-acc)}
.confirm{font-size:14px;border-radius:10px;padding:10px 12px;background:var(--ok-bg);color:var(--ok)}
.msg{font-size:13px;color:var(--muted)}
.cost{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;display:grid;gap:4px}
.cost b{font-variant-numeric:tabular-nums}
footer{margin-top:18px;font-size:12px;color:var(--muted)}
</style>

<div class="wrap">
  <header>
    <div class="brand">RUÉE</div>
    <div class="sub">@ruee_look 게시 검수 · 승인하면 정해진 요일 10:00에 올라가요</div>
  </header>
  <div id="banner" hidden></div>
  <h2 class="sec">이번 주 피드 미리보기</h2>
  <div class="grid" id="grid"></div>
  <h2 class="sec">시리즈</h2>
  <div class="list" id="list"><div class="msg">시트에서 시리즈를 불러오는 중…</div></div>
  <div class="cost" id="cost" hidden></div>
  <footer>AI코디_인스타_대기열 시트와 연결돼 있어요. 승인하면 시트 상태가 바뀌고 30분 안에 예약시각이 채워져요.</footer>
</div>

<script>
const IMGS = __IMGS__;
const SHEET = { server: "Google Sheets", id: "1JK7uPGYvzIhQhKKYk91vhGQTD9j69YQCg2BvuuUKJqc", range: "시리즈!A2:R100" };
const C = { S:0, TITLE:1, TYPE:2, CAP:8, TAGS:9, STATUS:10, TIME:11, POST:12, NOTE:13 };
const KINDS = {
  daily:{name:"DAILY",ko:"월요일 · 데일리",day:1}, street:{name:"STREET",ko:"수요일 · 스트릿",day:3},
  heritage:{name:"HERITAGE",ko:"금요일 · 헤리티지",day:5}, active:{name:"ACTIVE",ko:"토요일 · 운동",day:6}
};
const REASONS = ["컨셉이 안 맞아요","입고 싶지 않아요","색감이 별로예요","구도가 단조로워요","사진이 어색해요","얼굴이 보여요","글씨·디자인이 별로예요"];
let mcp = null, rows = [], slideRows = [], usage = [], pending = {}, confirmFor = null, rejectFor = null, rejectPick = {}, regenFor = null, cur = {}, unwatch = null;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function kindOf(type){
  const t = String(type||"");
  if(/운동/.test(t)) return "active"; if(/헤리티지/.test(t)) return "heritage"; if(/스트릿/.test(t)) return "street"; return "daily";
}
function nextSlot(day){
  const taken = new Set(rows.filter(r=>r[C.TIME]).map(r=>String(r[C.TIME]).slice(0,10)));
  const now = new Date();
  for(let k=0;k<45;k++){
    const d = new Date(now.getTime()+k*86400000);
    const kst = new Date(d.toLocaleString("en-US",{timeZone:"Asia/Seoul"}));
    const ymd = `${kst.getFullYear()}-${String(kst.getMonth()+1).padStart(2,"0")}-${String(kst.getDate()).padStart(2,"0")}`;
    const slot = new Date(ymd+"T10:00:00+09:00");
    if(kst.getDay()===day && !taken.has(ymd) && slot>now) return slot;
  }
  return null;
}
const fmt = d => d.toLocaleString("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit"});
function chipFor(st){
  const m = {"승인":["ok","승인됨"],"반려":["no","반려"],"검수대기":["","검수 대기"],"생성대기":["","사진 다시 만드는 중"],"재시도대기":["","게시 재시도 대기"],"게시실패":["no","게시 실패"]};
  const x = m[st]||["",st||"상태 없음"]; return `<span class="chip ${x[0]}">${esc(x[1])}</span>`;
}
const visible = () => rows.map((r,i)=>({r,i})).filter(({r})=>{
  const s=String(r[C.S]||"").trim(), st=String(r[C.STATUS]||"").trim();
  return s && IMGS[s] && st!=="게시완료" && st!=="반려";
});

function renderGrid(){
  const g = document.getElementById("grid");
  const order = ["daily","street","heritage","active"]; const by = {};
  visible().forEach(({r})=>{ by[kindOf(r[C.TYPE])] = by[kindOf(r[C.TYPE])] || String(r[C.S]).trim(); });
  g.innerHTML = order.map(k=>{
    const s = by[k]; const K = KINDS[k];
    const bg = {daily:"#b5573a;color:#fff",street:"#c6f432;color:#0e0e0e",heritage:"#b89b5e;color:#14161f",active:"#1f4fff;color:#fff"}[k];
    return s ? `<button class="g" data-jump="${s}" aria-label="${K.name} 표지로 이동"><img src="${IMGS[s][0]}" alt="${K.name} 표지"><span class="tag" style="background:${bg}">${K.name}</span></button>`
             : `<div class="g"><div class="ph">${K.name}<br>준비 중</div></div>`;
  }).join("");
}

function render(){
  renderGrid();
  const list = document.getElementById("list"); const vs = visible();
  if(!vs.length){ list.innerHTML = '<div class="msg">지금 승인할 시리즈가 없어요.</div>'; return; }
  list.innerHTML = vs.map(({r,i})=>{
    const s = String(r[C.S]).trim(), st = String(r[C.STATUS]).trim(), k = kindOf(r[C.TYPE]), K = KINDS[k], imgs = IMGS[s], busy = pending[s];
    const idx = cur[s]||0;
    let actions = "";
    if(st==="승인") actions = `<button class="act" data-act="unapprove" data-s="${s}" data-row="${i+2}" ${busy?"disabled":""}>승인 취소</button>`;
    else if(st==="생성대기") actions = `<span class="msg">사진을 다시 만드는 중이에요. 끝나면 검수 대기로 돌아와요.</span>`;
    else if(confirmFor===s){
      const sl = nextSlot(K.day);
      actions = `<div class="confirm" style="width:100%">승인하면 <b>${sl?fmt(sl):"다음 "+K.ko.slice(0,3)}</b>에 자동으로 올라가요.</div>
        <button class="act primary" data-act="approve" data-s="${s}" data-row="${i+2}" ${busy?"disabled":""}>네, 승인할게요</button>
        <button class="act" data-act="cancel">취소</button>`;
    } else actions = `<button class="act primary" data-act="ask" data-s="${s}" ${busy?"disabled":""}>승인</button>
        <button class="act" data-act="regen-open" data-s="${s}" ${busy?"disabled":""}>이 장만 다시 만들기</button>
        <button class="act danger" data-act="reject-open" data-s="${s}" ${busy?"disabled":""}>반려</button>`;
    let panel = "";
    if(rejectFor===s){
      const pick = rejectPick[s]||{};
      panel = `<div class="panel"><p>무엇이 아쉬웠나요? 여러 개를 골라도 돼요. 다음 기획에 반영해요.</p>
        <div class="reasons">${REASONS.map(x=>`<button class="${pick[x]?"on":""}" data-reason="${esc(x)}" data-s="${s}">${esc(x)}</button>`).join("")}</div>
        <div class="actions"><button class="act danger" data-act="reject" data-s="${s}" data-row="${i+2}" ${busy?"disabled":""}>반려 확정</button><button class="act" data-act="cancel">취소</button></div></div>`;
    }
    if(regenFor===s){
      const n = idx+1; const ok = n<=7;
      panel = `<div class="panel"><p>${ok?`지금 보는 <b>${n}번 장</b>의 사진만 새로 만들어요. 새 사진은 30분 안에 생성되고, 글씨를 입히는 합성은 Claude 채팅에서 '재합성'이라고 말하면 마저 해요. 그때까지 이 시리즈는 게시되지 않아요.`:`8~10번 장은 글씨 페이지라 사진을 다시 만들 수 없어요. 1~7번 장에서 골라 주세요.`}</p>
        <div class="actions">${ok?`<button class="act primary" data-act="regen" data-s="${s}" data-row="${i+2}" data-n="${n}" ${busy?"disabled":""}>${n}번 장 다시 만들기</button>`:""}<button class="act" data-act="cancel">닫기</button></div></div>`;
    }
    return `<article class="card" data-c="${k}" id="a-${s}">
      <div class="chead"><span class="cname">${K.name}</span><span class="code">${esc(s)} · ${K.ko}</span>${chipFor(st)}</div>
      <div class="car"><div class="track" id="t-${s}">${imgs.map((u,j)=>`<img src="${u}" alt="${esc(s)} ${j+1}번째 장" ${j<2?"":'loading="lazy"'}>`).join("")}</div>
        <button class="nav prev" data-nav="${s}" data-d="-1" aria-label="이전 장">‹</button><button class="nav next" data-nav="${s}" data-d="1" aria-label="다음 장">›</button>
        <span class="count" id="c-${s}">${idx+1}/${imgs.length}</span></div>
      <div class="thumbs" id="th-${s}">${imgs.map((u,j)=>`<button class="${j===idx?"on":""}" data-go="${s}" data-j="${j}" aria-label="${j+1}번 장"><img src="${u}" alt=""></button>`).join("")}</div>
      <div class="cbody">
        <h3 class="title">${esc(r[C.TITLE])}</h3>
        ${r[C.TIME]?`<div class="when">예약 <b>${esc(r[C.TIME])}</b></div>`:""}
        <div class="cap">${esc(r[C.CAP])}</div>
        <div class="tags">${esc(r[C.TAGS])}</div>
        ${r[C.NOTE]&&/오류|실패|재생성/.test(String(r[C.NOTE]))?`<div class="note">${esc(r[C.NOTE])}</div>`:""}
        ${busy?`<div class="msg">시트에 저장하는 중…</div>`:""}
        <div class="actions">${actions}</div>${panel}
      </div></article>`;
  }).join("");
  document.querySelectorAll(".track").forEach(t=>{
    const s=t.id.slice(2); if(cur[s]) t.scrollLeft = cur[s]*t.clientWidth;
    t.addEventListener("scroll",()=>{ const n=Math.round(t.scrollLeft/t.clientWidth); setIdx(s,n,false); },{passive:true});
  });
}
function setIdx(s,n,scroll){
  if(cur[s]===n) return; cur[s]=n;
  const c=document.getElementById("c-"+s); if(c) c.textContent=`${n+1}/${IMGS[s].length}`;
  document.querySelectorAll(`#th-${s} button`).forEach((b,j)=>b.classList.toggle("on",j===n));
  if(scroll){ const t=document.getElementById("t-"+s); t.scrollTo({left:t.clientWidth*n,behavior:"smooth"}); }
}
function renderCost(){
  const el=document.getElementById("cost"); if(!usage.length){ el.hidden=true; return; }
  const now=Date.now(); let n=0,sum=0,tot=0;
  usage.forEach(u=>{ const t=new Date(String(u[0]).replace(" ","T")+":00+09:00").getTime(); const c=Number(u[5])||0; tot+=c; if(now-t<7*86400000){ n++; sum+=c; } });
  el.hidden=false;
  el.innerHTML = `<div>이번 주 이미지 <b>${n}장</b> · 구글 사용액 약 <b>$${sum.toFixed(2)}</b> (약 ${Math.round(sum*1400).toLocaleString("ko-KR")}원)</div><div class="msg">스크립트가 장마다 기록한 토큰으로 계산한 추정치예요. 남은 크레딧은 매주 일요일 승인 메일에 함께 적어요.</div>`;
}

function showBanner(text){ const b=document.getElementById("banner"); b.textContent=text; b.hidden=!text; }
function errText(e){
  const s="Google Sheets";
  switch(e&&e.code){
    case "needs_reauth": return `${s} 연결이 만료됐어요. claude.ai 설정 → 커넥터에서 ${s}를 다시 연결해 주세요.`;
    case "server_not_connected": case "selection_required": return `${s} 커넥터가 연결돼 있지 않아요. claude.ai 설정 → 커넥터에서 ${s}를 추가해 주세요.`;
    case "not_in_manifest": case "approval_required": return `이 페이지가 ${s}를 쓰도록 허용되지 않았어요. 페이지 위쪽의 권한 요청에서 허용해 주세요.`;
    case "blocked_by_policy": return `조직 정책 때문에 ${s}를 쓸 수 없어요.`;
    case "server_unavailable": return `${s}가 잠시 응답하지 않아요. 잠시 뒤 다시 열어 주세요.`;
    case "tool_error": return `시트 작업이 실패했어요: ${e.message}`;
    default: return `시트와 연결하지 못했어요 (${e&&e.code||"알 수 없음"}).`;
  }
}
function watch(){
  if(unwatch) unwatch();
  unwatch = mcp.watchTool(SHEET.server,"get_values",{spreadsheetId:SHEET.id,range:SHEET.range},ev=>{
    if(ev.type==="data"){ rows=(ev.result.payload&&ev.result.payload.values)||[]; showBanner(""); render(); }
    else { const c=ev.error&&ev.error.code; if(["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","selection_required"].includes(c)){ rows=[]; render(); } showBanner(errText(ev.error)); }
  },{refetchInterval:60000});
  mcp.watchTool(SHEET.server,"get_values",{spreadsheetId:SHEET.id,range:"슬라이드!A2:B400"},ev=>{ if(ev.type==="data") slideRows=(ev.result.payload&&ev.result.payload.values)||[]; },{refetchInterval:300000});
  mcp.watchTool(SHEET.server,"get_values",{spreadsheetId:SHEET.id,range:"사용량!A2:F1000"},ev=>{ if(ev.type==="data"){ usage=(ev.result.payload&&ev.result.payload.values)||[]; renderCost(); } },{refetchInterval:300000});
}
async function write(s,updates){
  pending[s]=true; render();
  try{
    for(const u of updates) await mcp.callTool(SHEET.server,"update_values",{spreadsheetId:SHEET.id,range:u.range,values:u.values});
    await mcp.invalidate(SHEET.server,"get_values").catch(()=>{});
    const r=await mcp.callTool(SHEET.server,"get_values",{spreadsheetId:SHEET.id,range:SHEET.range},{cache:{refresh:true}});
    rows=(r.payload&&r.payload.values)||rows; showBanner("");
  }catch(e){ showBanner(errText(e)+" 시트를 열어 상태를 확인한 뒤 다시 눌러 주세요."); }
  finally{ delete pending[s]; confirmFor=null; rejectFor=null; regenFor=null; render(); }
}
const today = () => new Date().toLocaleDateString("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric"});

document.addEventListener("click",e=>{
  const jump=e.target.closest("[data-jump]");
  if(jump){ const a=document.getElementById("a-"+jump.dataset.jump); if(a) a.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  const nav=e.target.closest("[data-nav]");
  if(nav){ const t=document.getElementById("t-"+nav.dataset.nav); t.scrollBy({left:t.clientWidth*Number(nav.dataset.d),behavior:"smooth"}); return; }
  const go=e.target.closest("[data-go]"); if(go){ setIdx(go.dataset.go,Number(go.dataset.j),true); return; }
  const rs=e.target.closest("[data-reason]");
  if(rs){ const s=rs.dataset.s; rejectPick[s]=rejectPick[s]||{}; rejectPick[s][rs.dataset.reason]=!rejectPick[s][rs.dataset.reason]; render(); return; }
  const b=e.target.closest("[data-act]"); if(!b||!mcp) return;
  const s=b.dataset.s, row=b.dataset.row, a=b.dataset.act;
  if(a==="ask"){ confirmFor=s; rejectFor=null; regenFor=null; render(); }
  else if(a==="cancel"){ confirmFor=null; rejectFor=null; regenFor=null; render(); }
  else if(a==="reject-open"){ rejectFor=s; confirmFor=null; regenFor=null; render(); }
  else if(a==="regen-open"){ regenFor=s; confirmFor=null; rejectFor=null; render(); }
  else if(a==="approve") write(s,[{range:`시리즈!K${row}`,values:[["승인"]]}]);
  else if(a==="unapprove") write(s,[{range:`시리즈!K${row}:L${row}`,values:[["검수대기",""]]}]);
  else if(a==="reject"){
    const why=Object.keys(rejectPick[s]||{}).filter(x=>rejectPick[s][x]).join(", ")||"사유 선택 안 함";
    write(s,[{range:`시리즈!K${row}`,values:[["반려"]]},{range:`시리즈!N${row}`,values:[[`반려사유(${today()}): ${why}`]]}]);
  }
  else if(a==="regen"){
    const n=Number(b.dataset.n); const hit=slideRows.findIndex(x=>String(x[0]).trim()===s && Number(x[1])===n);
    if(hit<0){ showBanner("슬라이드 탭에서 이 장을 찾지 못했어요. 시트를 열어 확인해 주세요."); return; }
    write(s,[{range:`슬라이드!G${hit+2}`,values:[["재생성"]]},{range:`시리즈!K${row}`,values:[["생성대기"]]},{range:`시리즈!N${row}`,values:[[`${n}번 장 재생성 요청(${today()}), 합성 필요`]]}]);
  }
});
(async()=>{
  mcp = window.claude ? await window.claude.use("mcp") : null;
  render();
  if(!mcp){ document.getElementById("list").innerHTML='<div class="msg">이 화면에서는 시트에 연결할 수 없어요. claude.ai에서 이 페이지를 열어 주세요.</div>'; return; }
  watch();
})();
</script>
